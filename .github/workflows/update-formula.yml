name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jackymint/homebrew-kube-server
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Get checksums
        id: checksums
        run: |
          curl -sL https://github.com/jackymint/kube-server/releases/download/${{ github.ref_name }}/checksums.txt -o checksums.txt
          echo "arm64=$(grep arm64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "amd64=$(grep amd64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/kube-server.rb
          sed -i "s/sha256 \"[a-f0-9]*\" # arm64/sha256 \"${{ steps.checksums.outputs.arm64 }}\" # arm64/" Formula/kube-server.rb
          sed -i "s/sha256 \"[a-f0-9]*\" # amd64/sha256 \"${{ steps.checksums.outputs.amd64 }}\" # amd64/" Formula/kube-server.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kube-server.rb
          git commit -m "chore: update formula to ${{ github.ref_name }}"
          git push
