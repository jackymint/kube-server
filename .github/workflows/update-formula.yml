name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-formula:
    if: ${{ github.event.release.tag_name != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jackymint/homebrew-kube-server
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Get checksums
        id: checksums
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/checksums.txt" -o checksums.txt
          echo "arm64=$(grep arm64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "amd64=$(grep amd64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update formula
        env:
          VERSION: ${{ github.event.release.tag_name }}
          ARM64_SHA: ${{ steps.checksums.outputs.arm64 }}
          AMD64_SHA: ${{ steps.checksums.outputs.amd64 }}
        run: |
          export VERSION="${VERSION#v}"
          ruby <<'RUBY'
          path = "Formula/kube-server.rb"
          content = File.read(path)

          content.sub!(/version\s+"[^"]+"/, %(version "#{ENV.fetch("VERSION")}"))
          content.sub!(/(on_arm do\s+url\s+"[^"]+"\s+sha256\s+")[^"]+(")/m, "\\1#{ENV.fetch("ARM64_SHA")}\\2")
          content.sub!(/(on_intel do\s+url\s+"[^"]+"\s+sha256\s+")[^"]+(")/m, "\\1#{ENV.fetch("AMD64_SHA")}\\2")

          File.write(path, content)
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kube-server.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: update formula to ${{ github.event.release.tag_name }}"
          git push
